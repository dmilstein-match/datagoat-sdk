# Generated by npm run spec:build from src/core/journeys.ts. Do not edit.
arazzo: "1.1.0"
info:
  title: "Datagoat journeys"
  summary: "The five journeys as workflows: the first call of each and the call after it."
  description: "Generated from src/core/journeys.ts by npm run spec:build; the same list dg_describe, the MCP prompts, the skills and the docs are built from."
  version: "1.9.0"
sourceDescriptions:
  - name: datagoat
    url: "./openapi.json"
    type: openapi
workflows:
  - workflowId: try
    summary: "Try it"
    description: "Fits when the user has no data yet, or wants to see an answer and a refusal before using their own. Not when they already have a table of past cases. Ends with: A signed answer, an honest refusal, and what history supported, on free samples, in five minutes. Guide: https://datagoat.io/docs/quickstart"
    steps:
      - stepId: try_first_call
        description: "The first call of Try it."
        operationId: dg_describe
        requestBody:
          contentType: "application/json"
          payload: {}
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          try: "$response.body#/samples/0/try"
      - stepId: try_then
        description: "The call after it. 202 means the first fit is still running; the poll step after it waits for the answer."
        operationId: dg_ask
        requestBody:
          contentType: "application/json"
          payload: "$steps.try_first_call.outputs.try"
        successCriteria:
          - condition: "$statusCode == 200 || $statusCode == 202"
        outputs:
          task_id: "$response.body#/task_id"
      - stepId: try_then_poll
        description: "The ask's result by its task_id: 200 with the answer, or 202 while the fit runs (retried every 3 seconds)."
        operationId: dg_poll
        requestBody:
          contentType: "application/json"
          payload:
            task_id: "$steps.try_then.outputs.task_id"
        successCriteria:
          - condition: "$statusCode == 200"
        onFailure:
          - name: still_running
            type: retry
            retryAfter: 3
            retryLimit: 200
            criteria:
              - condition: "$statusCode == 202"
  - workflowId: ask
    summary: "Ask your data"
    description: "Fits when the user has a table of past cases with a yes/no outcome (churned, converted, faulted) and a question about it. Not when they will score cases for many customers of their own product. Ends with: Your own tables and logs mapped and asked, with a backtest or an honest no. Guide: https://datagoat.io/docs/ask-your-data"
    steps:
      - stepId: ask_first_call
        description: "The first call of Ask your data."
        operationId: dg_add_dataset
        requestBody:
          contentType: "application/json"
          payload:
            upload: true
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          dataset_id: "$response.body#/dataset_id"
          upload_pieces_url: "$response.body#/upload_pieces_url"
          upload_url: "$response.body#/upload_url"
          upload_page: "$response.body#/upload_page"
      - stepId: ask_then
        description: "The call after it. The CSV reaches the dataset first: a program POSTs it in pieces to upload_pieces_url (or PUTs it to upload_url), or a person opens upload_page. With answers {} it confirms when no slot has two survivors and returns the ask; otherwise mapping_answers_incomplete names the questions, which a proposal (the same call without answers) lists with their options for the person to answer."
        operationId: dg_map
        requestBody:
          contentType: "application/json"
          payload:
            sources:
              - dataset_id: "<dataset_id>"
            answers: {}
          replacements:
            - target: "/sources/0/dataset_id"
              value: "$steps.ask_first_call.outputs.dataset_id"
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          mapping_id: "$response.body#/mapping_id"
          dataset_id: "$response.body#/dataset_id"
          ask: "$response.body#/ask"
  - workflowId: ship
    summary: "Ship a product"
    description: "Fits when the user will score many customers' cases repeatedly, on a schedule, inside their own product. Not when it is a one-off question about one table. Ends with: A model per customer that scores new cases with no fit, gated before any action. Guide: https://datagoat.io/docs/build"
    inputs:
      type: object
      properties:
        rows:
          type: array
      required:
        - rows
    steps:
      - stepId: ship_first_call
        description: "The first call of Ship a product. 202 means the first fit is still running; the poll step after it waits for the answer."
        operationId: dg_ask
        requestBody:
          contentType: "application/json"
          payload:
            data:
              dataset_id: "sample:saas_churn"
            entity_column: customer_id
            subject_kind: org
            namespace: acme
            model_ttl_days: 90
            questions:
              churn:
                type: yesno
                outcome_column: churned
                outcome_is_desirable: false
            cases:
              ids:
                - cust_0001
        successCriteria:
          - condition: "$statusCode == 200 || $statusCode == 202"
        outputs:
          task_id: "$response.body#/task_id"
      - stepId: ship_first_call_poll
        description: "The ask's result by its task_id: 200 with the answer, or 202 while the fit runs (retried every 3 seconds)."
        operationId: dg_poll
        requestBody:
          contentType: "application/json"
          payload:
            task_id: "$steps.ship_first_call.outputs.task_id"
        successCriteria:
          - condition: "$statusCode == 200"
        onFailure:
          - name: still_running
            type: retry
            retryAfter: 3
            retryLimit: 200
            criteria:
              - condition: "$statusCode == 202"
        outputs:
          model_ref: "$response.body#/answers/churn/model_ref"
      - stepId: ship_then
        description: "The call after it. 202 means the first fit is still running; the poll step after it waits for the answer."
        operationId: dg_ask
        requestBody:
          contentType: "application/json"
          payload:
            entity_column: customer_id
            subject_kind: org
            namespace: acme
            questions:
              churn:
                type: yesno
                model_ref: "<model_ref>"
            cases:
              rows: "<rows>"
          replacements:
            - target: "/questions/churn/model_ref"
              value: "$steps.ship_first_call_poll.outputs.model_ref"
            - target: "/cases/rows"
              value: "$inputs.rows"
        successCriteria:
          - condition: "$statusCode == 200 || $statusCode == 202"
        outputs:
          task_id: "$response.body#/task_id"
      - stepId: ship_then_poll
        description: "The ask's result by its task_id: 200 with the answer, or 202 while the fit runs (retried every 3 seconds)."
        operationId: dg_poll
        requestBody:
          contentType: "application/json"
          payload:
            task_id: "$steps.ship_then.outputs.task_id"
        successCriteria:
          - condition: "$statusCode == 200"
        onFailure:
          - name: still_running
            type: retry
            retryAfter: 3
            retryLimit: 200
            criteria:
              - condition: "$statusCode == 202"
        outputs:
          model_ref: "$response.body#/answers/churn/model_ref"
  - workflowId: run
    summary: "Run it"
    description: "Fits when the user already has a model_ref in use and is learning what happened to the cases it scored. Not when no model has been fitted yet. Ends with: Outcomes reported, drift watched, and each model renewed, replaced or retired on evidence. Guide: https://datagoat.io/docs/run"
    inputs:
      type: object
      properties:
        model_ref:
          type: string
        outcomes:
          type: array
        mapping_id:
          type: string
      required:
        - model_ref
        - outcomes
        - mapping_id
    steps:
      - stepId: run_first_call
        description: "The first call of Run it."
        operationId: dg_report_outcomes
        requestBody:
          contentType: "application/json"
          payload:
            model_ref: "<model_ref>"
            outcomes: "<outcomes>"
          replacements:
            - target: "/model_ref"
              value: "$inputs.model_ref"
            - target: "/outcomes"
              value: "$inputs.outcomes"
        successCriteria:
          - condition: "$statusCode == 200"
      - stepId: run_then
        description: "The call after it."
        operationId: dg_schedule
        requestBody:
          contentType: "application/json"
          payload:
            mapping_id: "<mapping_id>"
            cadence: monthly
            subject_kind: org
          replacements:
            - target: "/mapping_id"
              value: "$inputs.mapping_id"
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          schedule_id: "$response.body#/schedule_id"
  - workflowId: prove
    summary: "Prove it"
    description: "Fits when the user must show someone the calls were right, or measure whether acting on them worked. Not when they only need the answer. Ends with: What history supported, a signed forward record, and evidence from acting, each labelled for what it is. Guide: https://datagoat.io/docs/prove"
    inputs:
      type: object
      properties:
        verdict:
          type: object
        signature:
          type: object
        model_ref:
          type: string
      required:
        - verdict
        - signature
        - model_ref
    steps:
      - stepId: prove_first_call
        description: "The first call of Prove it."
        operationId: dg_verify
        requestBody:
          contentType: "application/json"
          payload:
            verdict: "<verdict>"
            signature: "<signature>"
          replacements:
            - target: "/verdict"
              value: "$inputs.verdict"
            - target: "/signature"
              value: "$inputs.signature"
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          status: "$response.body#/status"
      - stepId: prove_then
        description: "The call after it."
        operationId: dg_track_record
        requestBody:
          contentType: "application/json"
          payload:
            model_ref: "<model_ref>"
          replacements:
            - target: "/model_ref"
              value: "$inputs.model_ref"
        successCriteria:
          - condition: "$statusCode == 200"
